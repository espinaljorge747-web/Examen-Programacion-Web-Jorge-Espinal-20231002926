<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Cotizaciones</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <header><h1>Realiza tus cotizaciones</h1></header>
        <nav>
            <ul class="navbar-nav ms-auto align-items-lg-left">
                <li class="nav-item"><a class="nav-link px-3" href="Index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link px-3" href="Catalogo.html">Catalogo</a></li>
                <li class="nav-item"><a class="nav-link px-3" href="Cotizaciones.html">Cotizaciones</a></li>
                <li class="nav-item"><a class="nav-link px-3" href="Contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <main class="container py-4">
            <form method="POST", enctype="multipart/form-data" class="card shadow-lg border-0 rounded-4 p-4 p-md-5 mx-auto bg-white" style="max-width: 720px;">
                <fieldset class="border-0 p-0 m-0">
                    <legend class="fs-5 fw-bold mb-4">Ingresa los datos de tu compra aqui</legend>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cantidad Unidades</label>
                        <input type="number", id="number", name="number", placeholder="Ingrese la cantidad" min="0" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Seleccione su producto</label>
                        <select id="producto", name="producto" required class="form-select">
                            <option value="Producto1">Pad-Mounted Monofásico 25 kVA (13.8 kV)-85,000.00lps</option>
                            <option value="Producto2">Panel Solar Monocristalino Nenotech 720W-5,695.00lps</option>
                            <option value="Producto3">Panel Solar Monocristalino Nenotech 350W-2990lps</option>
                            <option value="Producto4">Panel solar portatil Plegable 100w-2,210.00L</option>
                            <option value="Producto5">Inversor Híbrido Growatt SPH10000TL 10kW-129,882.00 lps</option>
                            <option value="Producto6">Inversor Híbrido CDP XVERTER 6000W-61,345.00lps</option>
                            <option value="Producto7">Inversor On-Grid Growatt MIN 3000TL-X-15,885.00lps</option>
                            <option value="Producto8">Inversor Solar Portátil CDP 700W-5,245.00 lps</option>
                            <option value="Producto9">Controlador de Carga Solar MPPT 60A-2,060.00lps</option>
                            <option value="Producto10">Controlador de Carga Solar PWM 20A-1,120.00</option>
                            <option value="Producto11">Autotransformador Split Phase Growatt 11.4K-20,245.00lps</option>
                            <option value="Producto12">Conectores Solares MC4 (Par 1-2)-473.00lps</option>
                            <option value="Producto13">Riel de Aluminio para Montaje Solar 4.2m-620.00 lps</option>
                            <option value="Producto14">Lámpara Solar Suburbana LED con Sensor-9,500lps</option>
                            <option value="Producto15">Batería de Gel para Alarma / UPS 7.2Ah-670.00lps</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Seleccione su ciudad</label>
                        <select id="ciudad", name="ciudad" required class="form-select">
                            <option value="Ciudad 1">Tegucigalpa-1000lps</option>
                            <option value="Ciudad 2">San pedro sula-2000lps</option>
                            <option value="Ciudad 3">Comayagua-1500lps</option>
                            <option value="Ciudad 4">La Ceiba-2500lps</option>
                            <option value="Ciudad 5">Juticalpa-1800lps</option>
                        </select>
                    </div>
                </fieldset>
            </form>
            <br>
            <section class="text-center my-4">
                <button type="button" class="btn btn-primary btn-lg rounded-pill px-5 fw-bold shadow-sm">Calcular Presupuesto</button>
            </section>
            <section class="mb-4">
                <div class="card bg-dark text-white text-center shadow-sm border-0 rounded-4 p-4 mx-auto" style="max-width: 720px;">
                    <h2 class="fs-4 font-monospace mb-0">El resultado de la cotizacion de envio es: 5000Lps</h2>
                </div>
            </section>
            <br>
            <section class="mx-auto" style="max-width: 720px;">
                <div class="alert alert-info border-0 rounded-4 shadow-sm">
                    <h3 class="alert-heading fs-5 fw-bold">Regla Comercial de la Empresa</h3>
                    <p class="mb-0">Descuento Comercial del 8% automatico en ordenes de 5 o mas unidades</p>
                </div>
                
            </section>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
