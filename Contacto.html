    </head>
    <body>
        <div class="bg-dark text-white small py-2">
            <div class="container d-flex flex-wrap justify-content-between gap-2">
                <p><Strong>Numero de Telefono: </Strong> +504 9876-7823</p>
                <p><Strong>Horaro de atencion:</Strong> Lunes a Viernes 10am-6pm</p>
                <button type="button" class="btn btn-success rounded-pill px-4 fw-bold">
                        Cotizar por whatsapp
                        <img src="Img/Whatsapp.jpeg" alt="Logo de whatsapp" height="20px" width="20px" class="ms-2">
                </button>
            </div>
        </div>
        <nav class="navbar navbar-expand-lg sticky-top shadow-sm py-3 bg-primary navbar-dark">
            <div id="menuNavegacion" class="collapse navbar-collapse">

                </ul>
            </div>
        </nav>
        <header><h1>Contacto</h1></header>
        <main class="container py-4">
             <form method="POST", enctype="multipart/form-data" class="card shadow-lg border-0 rounded-4 p-4 p-md-5 mx-auto bg-white" style="max-width: 720px;">
                <fieldset class="border-0 p-0 m-0">
                    <legend class="fs-5 fw-bold mb-4">Formulario Para Cotizaciones Formales</legend>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Empresa</label>
                        <input type="Text", id="Name", name="Name", placeholder="Ingrese el Nombre ", minlength="6", maxlength="50" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">RTN</label>
                        <input type="Number", id="RTN", name="RTN", placeholder="Ingrese el RTN",required pattern="[0-9]{4}-[0-9]{4}-[0-9]{6}" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo Electronico</label>
                        <input type="Text", id="", name="Mail", placeholder="Ingrese el Correo" class="form-control">
                    </div>
                    <div class="form-label fw-semibold">
                        <label>Telefono Contacto</label>
                        <input type="Text", id="Name", name="Name", placeholder="Ingrese el Nombre " class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Seleccione su Departamento de entrega</label>
                        <select id="Departamento", name="Departamento" required class="form-select">
                            <option value="Francisco Morazan">Francisco Morazan</option>
                            <option value="Cortes">Cortes</option>
                            <option value="Comayagua">Comayagua</option>
                            <option value="Choluteca">Choluteca</option>
                            <option value="Olancho">Olancho</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <p class="form-label fw-semibold mb-2">Desea Aceptar los terminos</p>
                        <label class="form-check form-check-inline"><input class="form-check-input" type="radio", name="Decision", value="aceptar">Aceptar</label>
                        <label><input type="radio", name="Decision", value="Declinar">Declinar</label>
                    </div>
                    <div class="d-flex flex-wrap justify-content-end gap-2">
                        <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold">Enviar</button>
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-4">Limpiar</button>
                    </div>
                </fieldset>
             </form>
        </main>
        <footer class="bg-dark text-white text-center py-4 mt-5">
            <p class="mb-0">TODOS LOS DERECHOS RESERVADOS, Parque Empresarial Periferico +504 9876-7823 </P>
        </footer>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
