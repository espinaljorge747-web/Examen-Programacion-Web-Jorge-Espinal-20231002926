<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Contacto</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <header><h1>Contacto</h1></header>
        <nav>
            <ul>
                <li><a href="Index.html">Inicio</a></li>
                <li><a href="Catalogo.html">Catalogo</a></li>
                <li><a href="Cotizaciones.html">Cotizaciones</a></li>
                <li><a href="Contacto.html">Contacto</a></li>
            </ul>
        </nav>
        <main>
             <form method="POST", enctype="multipart/form-data">
                <fieldset>
                    <legend>Formulario Para Cotizaciones Formales</legend>
                    <div>
                        <label>Nombre Empresa</label>
                        <input type="Text", id="Name", name="Name", placeholder="Ingrese el Nombre ", minlength="6", maxlength="50">
                    </div>
                    <div>
                        <label>RTN</label>
                        <input type="Number", id="RTN", name="RTN", placeholder="Ingrese el RTN",required pattern="[0-9]{4}-[0-9]{4}-[0-9]{6}">
                    </div>
                    <div>
                        <label>Correo Electronico</label>
                        <input type="Text", id="", name="Mail", placeholder="Ingrese el Correo">
                    </div>
                    <div>
                        <label>Telefono Contacto</label>
                        <input type="Text", id="Name", name="Name", placeholder="Ingrese el Nombre ">
                    </div>
                    <div>
                        <label>Seleccione su Departamento de entrega</label>
                        <select id="Departamento", name="Departamento" required>
                            <option value="Francisco Morazan">Francisco Morazan</option>
                            <option value="Cortes">Cortes</option>
                            <option value="Comayagua">Comayagua</option>
                            <option value="Choluteca">Choluteca</option>
                            <option value="Olancho">Olancho</option>
                        </select>
                    </div>
                    <div>
                        <p>Desea Aceptar los terminos</p>
                        <label><input type="radio", name="Decision", value="aceptar">Aceptar</label>
                        <label><input type="radio", name="Decision", value="Declinar">Declinar</label>
                    </div>
                    <div>
                        <button type="button">Enviar</button>
                        <button type="button">Limpiar</button>
                    </div>
                </fieldset>
             </form>
        </main>
          <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
